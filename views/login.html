<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="/public/style.css" />

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #0b1220, #0f1e3d);
            font-family: ui-sans-serif, system-ui, -apple-system;
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            width: 100%;
        }

        .left {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .login-card h2 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .login-card p {
            margin-bottom: 25px;
            color: #94a3b8;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(11, 18, 32, 0.85);
            color: white;
            outline: none;
            transition: 0.2s;
        }

        .login-card input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(180deg, #22c55e, #16a34a);
            color: #06110b;
            transition: 0.2s ease;
        }

        .login-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(34, 197, 94, 0.3);
        }

        .register-link {
            margin-top: 15px;
            text-align: center;
            color: #94a3b8;
        }

        .register-link a {
            color: #22c55e;
            text-decoration: none;
        }

        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brain-float {
            width: 550px;
            animation: floatBrain 6s ease-in-out infinite;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6));
        }

        @keyframes floatBrain {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-25px); }
            100% { transform: translateY(0px); }
        }

        @media(max-width: 900px) {
            .right { display: none; }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <!-- LEFT LOGIN CARD -->
        <div class="left">
            <div class="login-card">
                <h2>Welcome to Quiz Engine</h2>
                <p>Please login to continue</p>
                <div id="errorMessage" style="color:#f87171; margin-bottom:15px; text-align:center;"></div>

                <form method="POST" action="/login">
                    <input type="email" name="email" placeholder="Enter your email" required />
                    <input type="password" name="password" placeholder="Enter your password" required />
                    <button type="submit">Login</button>
                </form>

                <div class="register-link">
                    Don't have an account?
                    <a href="/register">Register</a>
                </div>

            </div>
        </div>

        <!-- RIGHT IMAGE -->
        <div class="right">
            <img src="/public/images/brain.png" class="brain-float" />
        </div>

    </div>
    <script>
fetch("/login-error")
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      document.getElementById("errorMessage").innerText = data.error;
    }
  });
</script>

</body>

</html>
